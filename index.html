
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKHINSKY JUICY CUBE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:white;font-family:Arial;text-align:center}
header{padding:22px 8px}
h1{color:#e7bd55;letter-spacing:2px;font-size:25px}
h2{font-size:16px;color:#aaa}
.panel{background:#17191e;border:1px solid #9e792e;border-radius:14px;padding:15px;margin:15px auto;width:90%;max-width:390px}
.coins{font-size:23px;color:#f4cf65}
select{padding:10px;border-radius:8px;font-size:17px}
.reels{display:flex;justify-content:center;gap:8px;margin:22px auto}
.reel{background:#eee;color:#111;border:3px solid #b18a35;border-radius:12px;width:90px;height:90px;display:grid;place-items:center;font-size:42px}
button{background:#c99c36;color:#111;border:1px solid #e7bd55;border-radius:11px;padding:14px 22px;font-size:17px;font-weight:bold;margin:7px;cursor:pointer}
button:disabled{opacity:.4}
#message{min-height:65px;color:#f4cf65;padding:15px;font-size:18px}
.hidden{display:none}
.safe{width:85px;height:85px;font-size:30px;background:#24262c;color:white}
.rope{font-size:60px;margin:12px}
footer{color:#777;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<h1>TAKHINSKY</h1>
<h2>JUICY CUBE · GOLD VIP EDITION</h2>
</header>

<div class="panel coins">🪙 МОИ МОНЕТЫ: <b id="coins">1000</b></div>

<div class="panel">
СТАВКА:
<br><br>
<select id="bet">
<option value="10">10 монет</option>
<option value="50">50 монет</option>
<option value="100">100 монет</option>
<option value="500">500 монет</option>
<option value="1000">1000 монет</option>
</select>
<br><br>
<button id="spin" onclick="spin()">КРУТИТЬ БАРАБАНЫ</button>
</div>

<div class="reels">
<div class="reel" id="r1">🧊</div>
<div class="reel" id="r2">💎</div>
<div class="reel" id="r3">🪙</div>
</div>

<div id="message">Сделай ставку и испытай удачу!</div>

<div id="bonus" class="panel hidden">
<h2>🎁 БОНУСНЫЙ ПРОХОД</h2>
<p>Дёрни за верёвку! Рука сверху бросит кубик.</p>
<div class="rope">🪢</div>
<button onclick="pull()">ДЁРНУТЬ ЗА ВЕРЁВКУ</button>
<p id="attempts"></p>
<div id="safes"></div>
</div>

<button onclick="newGame()">НОВАЯ ИГРА</button>

<footer>TAKHINSKY JUICY CUBE © 2026<br>Только виртуальные игровые монеты.</footer>

<script>
let coins=1000;
let tries=0;
let rescue=false;
let bonusOpen=false;
let bet=10;
const symbols=["🧊","💎","🪙","🎲","⬛"];

function update(){
 document.getElementById("coins").textContent=coins;
}

function spin(){
 if(bonusOpen)return;
 bet=Number(document.getElementById("bet").value);
 if(coins<bet){
  document.getElementById("message").textContent="Недостаточно монет!";
  return;
 }
 coins-=bet;
 update();
 document.getElementById("spin").disabled=true;
 let a=symbols[Math.floor(Math.random()*symbols.length)];
 let b=symbols[Math.floor(Math.random()*symbols.length)];
 let c=symbols[Math.floor(Math.random()*symbols.length)];
 document.getElementById("r1").textContent=a;
 document.getElementById("r2").textContent=b;
 document.getElementById("r3").textContent=c;

 if(a===b&&b===c){
  let win=bet*10;
  coins+=win;
  document.getElementById("message").textContent="💎 ДЖЕКПОТ! +" + win + " монет!";
  update();
  document.getElementById("spin").disabled=false;
 }else if(a===b||b===c||a===c){
  let win=bet*2;
  coins+=win;
  document.getElementById("message").textContent="🧊 КОМБИНАЦИЯ! +" + win + " монет!";
  update();
  document.getElementById("spin").disabled=false;
 }else{
  document.getElementById("message").textContent="🎁 Открылся бонусный проход!";
  startBonus();
 }
}

function startBonus(){
 bonusOpen=true;
 tries=bet>=1000?7:bet>=500?5:bet>=100?3:bet>=50?2:1;
 rescue=false;
 document.getElementById("bonus").classList.remove("hidden");
 document.getElementById("attempts").textContent="Попыток: "+tries;
 document.getElementById("safes").innerHTML="";
 document.getElementById("spin").disabled=true;
}

function pull(){
 if(tries<=0){
  if(!rescue){
   rescue=true;
   tries=1;
   document.getElementById("message").textContent="🤝 Последняя спасительная попытка!";
  }else{
   finishBonus();
   return;
  }
 }
 document.getElementById("message").textContent="🖐️ Рука бросает кубик сверху!";
 let win=Math.random();
 let result="";
 if(win<0.35){
  result="ПУСТО";
 }else if(win<0.65){
  result="МАЛЕНЬКИЙ КУБИК";
 }else if(win<0.88){
  result="БОЛЬШОЙ КУБИК";
 }else{
  result="СУПЕРБОНУС";
 }
 let prize=0;
 if(result==="МАЛЕНЬКИЙ КУБИК")prize=bet*3;
 if(result==="БОЛЬШОЙ КУБИК")prize=bet*10;
 if(result==="СУПЕРБОНУС")prize=bet*25;
 coins+=prize;
 update();
 document.getElementById("message").textContent=
 result==="ПУСТО"?"⬛ Пустой кубик!": "🎉 "+result+"! +" + prize+" монет!";
 document.getElementById("attempts").textContent="Осталось попыток: "+Math.max(0,tries-1);
 tries--;
 if(prize>0){
  finishBonus();
 }else if(tries<=0&&!rescue){
  document.getElementById("message").textContent+=" Есть одна спасительная попытка!";
 }else if(tries<=0&&rescue){
  finishBonus();
 }
}

function finishBonus(){
 bonusOpen=false;
 document.getElementById("bonus").classList.add("hidden");
 document.getElementById("spin").disabled=false;
 document.getElementById("message").textContent+=" Бонус завершён. Можно играть дальше!";
}

function newGame(){
 if(bonusOpen){
  document.getElementById("message").textContent="Сначала закончи бонус!";
  return;
 }
 document.getElementById("message").textContent="Новая игра! Выбирай ставку.";
 document.getElementById("spin").disabled=false;
 document.getElementById("r1").textContent="🧊";
 document.getElementById("r2").textContent="💎";
 document.getElementById("r3").textContent="🪙";
}
</script>
</body>
</html>
